<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="icon" href="images.png">
</head>
<body>
  <h1>Study Planner</h1>

  <label for="taskInput">Study Task</label>
  <input id="taskInput" type="text" placeholder="Enter a study task">
  <button id="addBtn">Add Task</button>

  <div id="taskFilters">
    <button type="button" data-filter="all">All</button>
    <button type="button" data-filter="pending">Pending</button>
    <button type="button" data-filter="completed">Completed</button>
  </div>

  <ul id="taskList"></ul>

  <p id="message"></p>

  <script src="index.js" defer></script>
</body>
</html>
